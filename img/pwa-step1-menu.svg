<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Phone Card Frame -->
  <rect x="8" y="8" width="384" height="224" rx="16" fill="url(#bgGrad1)" stroke="#334155" stroke-width="1.5"/>

  <!-- Android System Status Bar -->
  <rect x="8" y="8" width="384" height="24" rx="16" fill="#0b1120"/>
  <rect x="8" y="20" width="384" height="12" fill="#0b1120"/>
  <text x="28" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">10:30</text>
  <!-- Status Icons: 4G / WiFi / Battery -->
  <circle cx="330" cy="21" r="3" fill="#64748b"/>
  <path d="M346 17 L354 25 L338 25 Z" fill="#64748b"/>
  <rect x="362" y="16" width="18" height="10" rx="2" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <rect x="364" y="18" width="12" height="6" rx="1" fill="#10b981"/>

  <!-- Chrome Browser App Bar -->
  <rect x="18" y="38" width="364" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2" filter="url(#shadow1)"/>
  
  <!-- Home Icon -->
  <path d="M34 66 L42 58 L50 66 L50 72 L45 72 L45 67 L39 67 L39 72 L34 72 Z" fill="#94a3b8"/>

  <!-- URL Address Bar Pill -->
  <rect x="58" y="46" width="225" height="36" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <!-- Lock Icon -->
  <path d="M72 63 L72 60 C72 57.8 73.8 56 76 56 C78.2 56 80 57.8 80 60 L80 63" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <rect x="70" y="63" width="12" height="9" rx="1.5" fill="#10b981"/>
  <circle cx="76" cy="67.5" r="1" fill="#0f172a"/>
  <!-- Website URL text -->
  <text x="88" y="69" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">sshsghaghra.edu.in</text>
  <!-- Refresh Icon -->
  <path d="M268 64 A 5 5 0 1 1 267 60" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <polyline points="266,57 267,61 271,60" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <!-- Tab Count Square -->
  <rect x="292" y="52" width="22" height="22" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="299" y="68" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="700">1</text>

  <!-- 3-Dots Menu Button Highlighted -->
  <!-- Pulsing Glow Ring -->
  <circle cx="344" cy="64" r="22" fill="url(#pulseGlow)"/>
  <circle cx="344" cy="64" r="16" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="2"/>
  
  <!-- 3 Dots -->
  <circle cx="344" cy="56" r="2.5" fill="#ffffff"/>
  <circle cx="344" cy="64" r="2.5" fill="#ffffff"/>
  <circle cx="344" cy="72" r="2.5" fill="#ffffff"/>

  <!-- Hand pointer icon pointing to 3-dots -->
  <g transform="translate(330, 92)">
    <text font-size="28">👆</text>
  </g>

  <!-- Action Callout Bubble -->
  <g transform="translate(140, 110)">
    <rect x="0" y="0" width="186" height="52" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow1)"/>
    <!-- Triangle pointer to 3 dots -->
    <polygon points="170,0 180,-10 160,0" fill="#1e3a8a"/>
    <text x="14" y="22" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">STEP 1 IN CHROME</text>
    <text x="14" y="40" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800">Tap Three Dots (⋮) Menu</text>
  </g>

  <!-- Educational portal banner mockup below -->
  <rect x="18" y="174" width="364" height="46" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="42" cy="197" r="14" fill="#2563eb"/>
  <text x="35" y="202" font-size="14">🎓</text>
  <text x="64" y="195" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">SS+2 High School Ghaghra</text>
  <text x="64" y="209" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">IT/ITeS Offline Study Library</text>
</svg>
