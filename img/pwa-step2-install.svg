<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Phone Card Frame -->
  <rect x="8" y="8" width="384" height="224" rx="16" fill="url(#bgGrad2)" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Side: Browser Context Background -->
  <rect x="20" y="24" width="150" height="192" rx="10" fill="#1e293b" opacity="0.6"/>
  <circle cx="45" cy="50" r="14" fill="#2563eb" opacity="0.7"/>
  <text x="38" y="55" font-size="14">🎓</text>
  <rect x="68" y="44" width="90" height="10" rx="3" fill="#64748b" opacity="0.7"/>
  <rect x="30" y="76" width="130" height="60" rx="6" fill="#334155" opacity="0.5"/>
  <rect x="30" y="146" width="130" height="60" rx="6" fill="#334155" opacity="0.5"/>

  <!-- Step 2 Label Callout on Left -->
  <g transform="translate(20, 96)">
    <rect x="0" y="0" width="150" height="90" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow2)"/>
    <text x="12" y="22" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">STEP 2 IN MENU</text>
    <text x="12" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800">Select "Install app"</text>
    <text x="12" y="60" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5">Or tap "Add to Home</text>
    <text x="12" y="74" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5">screen" in browser</text>
  </g>

  <!-- Right Side: Chrome Dropdown Menu Card -->
  <g transform="translate(186, 20)" filter="url(#shadow2)">
    <rect x="0" y="0" width="194" height="200" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>

    <!-- Menu Item 1: New tab -->
    <text x="14" y="26" font-size="14">➕</text>
    <text x="38" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">New tab</text>
    <line x1="12" y1="36" x2="182" y2="36" stroke="#334155" stroke-width="1"/>

    <!-- Menu Item 2: Downloads -->
    <text x="14" y="56" font-size="14">📥</text>
    <text x="38" y="56" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">Downloads</text>
    <line x1="12" y1="66" x2="182" y2="66" stroke="#334155" stroke-width="1"/>

    <!-- Menu Item 3: HIGHLIGHTED "Install app" -->
    <rect x="6" y="74" width="182" height="42" rx="8" fill="#2563eb" stroke="#60a5fa" stroke-width="2"/>
    <!-- Animated Pulsing Accent -->
    <circle cx="24" cy="95" r="12" fill="#1d4ed8"/>
    <text x="16" y="100" font-size="15">📲</text>
    <text x="42" y="94" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800">Install app</text>
    <text x="42" y="107" fill="#bfdbfe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600">SSHS Notes Portal</text>
    <text x="154" y="99" font-size="14">👉</text>

    <!-- Menu Item 4: Add to Home screen (alt) -->
    <text x="14" y="138" font-size="14">🏠</text>
    <text x="38" y="137" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">Add to Home screen</text>
    <line x1="12" y1="148" x2="182" y2="148" stroke="#334155" stroke-width="1"/>

    <!-- Menu Item 5: Desktop site -->
    <text x="14" y="168" font-size="13">💻</text>
    <text x="38" y="167" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Desktop site</text>

    <!-- Menu Item 6: Settings -->
    <text x="14" y="190" font-size="13">⚙️</text>
    <text x="38" y="189" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Settings</text>
  </g>
</svg>
