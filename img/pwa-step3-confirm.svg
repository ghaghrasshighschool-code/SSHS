<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="dialogShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Phone Card Frame with dimmed scrim -->
  <rect x="8" y="8" width="384" height="224" rx="16" fill="url(#bgGrad3)" stroke="#334155" stroke-width="1.5"/>

  <!-- Dimmed Background Elements representing the website behind dialog -->
  <g opacity="0.25">
    <rect x="24" y="24" width="352" height="40" rx="8" fill="#334155"/>
    <rect x="24" y="74" width="168" height="60" rx="8" fill="#334155"/>
    <rect x="208" y="74" width="168" height="60" rx="8" fill="#334155"/>
  </g>

  <!-- Android Native Install Confirmation Dialog -->
  <g transform="translate(56, 32)" filter="url(#dialogShadow)">
    <!-- Dialog Card Container -->
    <rect x="0" y="0" width="288" height="176" rx="20" fill="#1e293b" stroke="#3b82f6" stroke-width="1.8"/>

    <!-- Dialog Title -->
    <text x="24" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800">Install app?</text>

    <!-- App Identity Row -->
    <g transform="translate(24, 48)">
      <!-- App Icon -->
      <rect x="0" y="0" width="48" height="48" rx="12" fill="linear-gradient(135deg, #2563eb, #1d4ed8)" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="12" y="32" font-size="24">🎓</text>

      <!-- App Name & Domain -->
      <text x="60" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">SSHS Notes</text>
      <text x="60" y="36" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">sshsghaghra.edu.in</text>
      <rect x="60" y="42" width="116" height="18" rx="9" fill="rgba(16, 185, 129, 0.2)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
      <text x="68" y="54" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700">⚡ 100% Offline Ready</text>
    </g>

    <!-- Action Buttons Row -->
    <line x1="0" y1="126" x2="288" y2="126" stroke="#334155" stroke-width="1"/>

    <!-- Cancel Button -->
    <rect x="94" y="134" width="76" height="34" rx="8" fill="transparent"/>
    <text x="114" y="156" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Cancel</text>

    <!-- HIGHLIGHTED Install Button -->
    <rect x="180" y="134" width="94" height="34" rx="8" fill="#2563eb" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="206" y="156" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800">Install</text>

    <!-- Pointer Hand on Install Button -->
    <g transform="translate(225, 146)">
      <circle cx="16" cy="16" r="14" fill="#f59e0b" fill-opacity="0.3"/>
      <text x="4" y="24" font-size="24">👆</text>
    </g>
  </g>

  <!-- Step 3 Callout Badge at Top-Right -->
  <g transform="translate(18, 18)">
    <rect x="0" y="0" width="110" height="24" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
    <text x="8" y="16" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800">STEP 3: CONFIRM</text>
  </g>
</svg>
