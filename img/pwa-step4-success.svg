<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="appIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3b82f6" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Phone Card Frame with Wallpaper -->
  <rect x="8" y="8" width="384" height="224" rx="16" fill="url(#wallGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Wallpaper Decorative Circles -->
  <circle cx="280" cy="80" r="70" fill="#2563eb" fill-opacity="0.12"/>
  <circle cx="120" cy="180" r="90" fill="#7c3aed" fill-opacity="0.1"/>

  <!-- Step 4 Badge Callout on Top -->
  <g transform="translate(20, 18)">
    <rect x="0" y="0" width="156" height="26" rx="13" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
    <text x="12" y="17" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800">✅ STEP 4: INSTALLED!</text>
  </g>

  <!-- Home Screen App Grid -->
  <!-- App 1: Phone -->
  <g transform="translate(48, 64)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#15803d" opacity="0.7"/>
    <text x="12" y="32" font-size="22">📞</text>
    <text x="10" y="60" fill="#94a3b8" font-family="sans-serif" font-size="10">Phone</text>
  </g>

  <!-- App 2: Messages -->
  <g transform="translate(120, 64)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#0284c7" opacity="0.7"/>
    <text x="12" y="32" font-size="22">💬</text>
    <text x="5" y="60" fill="#94a3b8" font-family="sans-serif" font-size="10">Messages</text>
  </g>

  <!-- App 3: HIGHLIGHTED SSHS NOTES APP -->
  <g transform="translate(210, 52)" filter="url(#glow4)">
    <!-- App Pulse Ring -->
    <rect x="-6" y="-6" width="76" height="76" rx="20" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="4 2"/>
    
    <!-- Main App Icon -->
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#appIconGrad)" stroke="#ffffff" stroke-width="2"/>
    <text x="16" y="42" font-size="32">🎓</text>

    <!-- Verified PWA Badge -->
    <circle cx="56" cy="10" r="11" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <text x="50" y="15" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="900">✓</text>

    <!-- App Name Label -->
    <text x="4" y="80" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800">SSHS Notes</text>
    <rect x="-8" y="86" width="80" height="18" rx="9" fill="#10b981"/>
    <text x="-1" y="98" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800">100% OFFLINE</text>
  </g>

  <!-- App 4: Chrome -->
  <g transform="translate(310, 64)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#ea580c" opacity="0.7"/>
    <text x="12" y="32" font-size="22">🌐</text>
    <text x="7" y="60" fill="#94a3b8" font-family="sans-serif" font-size="10">Chrome</text>
  </g>

  <!-- Bottom Success Notification Box -->
  <g transform="translate(24, 168)">
    <rect x="0" y="0" width="352" height="52" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="28" cy="26" r="14" fill="#10b981"/>
    <text x="21" y="31" font-size="15">🎉</text>
    <text x="52" y="21" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800">App Added to Your Home Screen!</text>
    <text x="52" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5">One tap to launch anytime with zero mobile data required.</text>
  </g>
</svg>
